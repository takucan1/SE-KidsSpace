<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz - KidsSpace LMS</title>
    <link rel="stylesheet" href="Quizzes_Activities.css">
    <style>
        .question-block { border: 1px solid #ccc; padding: 10px; margin-bottom: 15px; }
        .remove-btn { background-color: red; color: white; border: none; padding: 3px 6px; cursor: pointer; }
        .back-btn { margin-left: 20px; padding: 8px 15px; background-color: #007BFF; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .back-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <!-- TOP NAVBAR -->
    <header class="top-nav">
        <div class="nav-left">
            <button class="icon-btn">☰</button>
            <div class="logo">KidsSpace LMS</div>
            <button class="back-btn" onclick="window.location.href='teacherpage.php'">Back to Dashboard</button>
        </div>
        <div class="nav-right">
            <div class="hi">Hi, Professor!</div>
            <div class="profile">
                <img src="teacherlogo.png" alt="Profile">
            </div>
        </div>  
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <h2>Create a Global Quiz</h2>
        <form id="quizForm">
            <label for="title">Quiz Title:</label><br>
            <input type="text" id="title" placeholder="Enter Quiz Title" required><br><br>

            <label for="description">Quiz Description:</label><br>
            <textarea id="description" placeholder="Enter Quiz Description"></textarea><br><br>

            <div id="questions-container"></div>

            <button type="button" id="add-question-btn">+ Add Question</button><br><br>
            <button type="submit">Create Quiz</button>
        </form>
    </main>

    <!-- BOTTOM NAVBAR -->
    <footer class="bottom-nav">
        Version 1.3.1
    </footer>

    <!-- JS SCRIPT -->
    <script>
        const questionsContainer = document.getElementById('questions-container');
        let questionCount = 0;

        // Function to add a new question block
        function addQuestion() {
            questionCount++;
            const div = document.createElement('div');
            div.classList.add('question-block');
            div.setAttribute('data-id', questionCount);
            div.innerHTML = `
                <h3>Question ${questionCount}</h3>
                <input type="text" class="question" placeholder="Enter Question" required><br><br>
                <input type="text" class="option_a" placeholder="Option A" required>
                <input type="text" class="option_b" placeholder="Option B" required>
                <input type="text" class="option_c" placeholder="Option C" required>
                <input type="text" class="option_d" placeholder="Option D" required><br><br>
                <label>Correct Option:</label>
                <select class="correct_option">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
                <button type="button" class="remove-btn" onclick="removeQuestion(${questionCount})">Remove</button>
            `;
            questionsContainer.appendChild(div);
        }

        // Function to remove a question block
        function removeQuestion(id) {
            const block = document.querySelector(`.question-block[data-id='${id}']`);
            if(block) questionsContainer.removeChild(block);
        }

        document.getElementById('add-question-btn').addEventListener('click', addQuestion);

        // Initial question
        addQuestion();

        // Handle quiz form submission
        document.getElementById('quizForm').addEventListener('submit', async e => {
            e.preventDefault();

            const questions = [];
            document.querySelectorAll('.question-block').forEach(block => {
                questions.push({
                    question: block.querySelector('.question').value,
                    option_a: block.querySelector('.option_a').value,
                    option_b: block.querySelector('.option_b').value,
                    option_c: block.querySelector('.option_c').value,
                    option_d: block.querySelector('.option_d').value,
                    correct_option: block.querySelector('.correct_option').value
                });
            });

            const response = await fetch('create_quiz.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    title: document.getElementById('title').value,
                    description: document.getElementById('description').value,
                    questions
                })
            });

            const result = await response.json();
            if(result.status === 'success') {
                alert('Quiz created successfully!');
                document.getElementById('quizForm').reset();
                questionsContainer.innerHTML = '';
                questionCount = 0;
                addQuestion(); // add one blank question again
            } else {
                alert('Error creating quiz: ' + result.message);
            }
        });
    </script>
</body>
</html>
